
name: Build NEXUS APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS_Android_Reviewed.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p extracted
          unzip -q NEXUS_Android_Reviewed.zip -d extracted
          PROJECT="$(find extracted -type f -name settings.gradle.kts -print -quit)"
          test -n "$PROJECT"
          PROJECT="$(dirname "$PROJECT")"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project: $PROJECT"

      - name: Fix Kotlin versions
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            sed -i 's/2.1.0/2.4.0/g; s/2.2.0/2.4.0/g' "$file"
          done < <(find "$PROJECT_DIR" -type f \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.toml' -o -name 'gradle.properties' \) -print0)

          echo "===== Kotlin settings ====="
          grep -RInE 'kotlin|2.4.0' "$PROJECT_DIR" --include='*.gradle' --include='*.gradle.kts' --include='*.toml' || true

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        shell: bash
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
