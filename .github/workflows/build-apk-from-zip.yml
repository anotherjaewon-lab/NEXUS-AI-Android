name: Build NEXUS APK from uploaded project ZIP

on:
  workflow_dispatch:
  push:
    paths:
      - 'NEXUS_Android_Reviewed.zip'
      - '.github/workflows/build-apk-from-zip.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Extract Android project ZIP
        run: |
          set -eux
          mkdir -p extracted
          unzip -q NEXUS_Android_Reviewed.zip -d extracted
          PROJECT="$(find extracted -type f -name settings.gradle.kts -print -quit | xargs dirname)"
          test -n "$PROJECT"
          echo "PROJECT_DIR=$PROJECT" >> "$GITHUB_ENV"
          echo "Project root: $PROJECT"

      # Align Kotlin plugin declarations across Gradle scripts AND version catalogs.
      - name: Align Kotlin compiler/plugin to 2.4.0
        run: |
          set -eux
          find "$PROJECT_DIR" -type f \\
            \( -name '*.gradle' -o -name '*.gradle.kts' -o -name '*.toml' -o -name 'gradle.properties' \\
            \) -print0 | xargs -0 -r sed -i -E \\
            's/2\\.1\\.0/2.4.0/g; s/2\\.2\\.0/2.4.0/g'
          echo "---- Kotlin declarations after patch ----"
          grep -RInE 'kotlin|org.jetbrains.kotlin|2\\.[0-9]+\\.[0-9]+' "$PROJECT_DIR" \\
            --include='*.gradle' --include='*.gradle.kts' --include='*.toml' || true

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon --stacktrace clean assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
